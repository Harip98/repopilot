name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-svc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  python-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-svc
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot_dev_pw
          POSTGRES_DB: repopilot
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U repopilot -d repopilot"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m integration

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sandbox-svc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/sandbox-svc/go.mod
          cache: false  # no go.sum yet: the module has no dependencies
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker build -t repopilot-sandbox-base bench/images/base
      - run: docker compose up -d --build --wait sandbox-svc
      - run: uv sync --locked
        working-directory: services/agent-svc
      - run: uv run pytest -m sandbox -v
        working-directory: services/agent-svc
      - if: failure()
        run: docker compose logs sandbox-svc

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
