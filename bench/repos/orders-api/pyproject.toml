[project]
name = "orders-api"
version = "0.4.2"
description = "Orders service: list, create and cancel customer orders"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
