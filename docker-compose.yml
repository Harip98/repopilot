name: repopilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # Read when the data volume is first created; later changes need a fresh volume.
      POSTGRES_USER: ${REPOPILOT_PG_USER:-repopilot}
      POSTGRES_PASSWORD: ${REPOPILOT_PG_PASSWORD:-repopilot_dev_pw}
      POSTGRES_DB: ${REPOPILOT_PG_DB:-repopilot}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only process with the Docker socket. Socket access is root-equivalent on the host,
  # which is why this service is small, authenticated, loopback-only and locked down itself.
  sandbox-svc:
    build: ./services/sandbox-svc
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=1g  # staging for sanitised uploads and workspace snapshots during resets
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${REPOPILOT_SANDBOX_TOKEN:-dev-sandbox-token-change-me}
      SANDBOX_IMAGE_PREFIXES: "repopilot-sandbox-,repopilot-bench-"
      SANDBOX_TTL: "2h"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # The API and worker (`docker compose --profile app up -d`). For local development they also
  # run on the host: `repopilot serve` and `repopilot worker`.
  api:
    profiles: ["app"]
    restart: unless-stopped
    build: {context: ., dockerfile: services/agent-svc/Dockerfile}
    image: repopilot-agent-svc
    # Listens on all interfaces inside the container but is published on loopback only.
    command: ["repopilot", "serve", "--host", "0.0.0.0", "--port", "8000", "--allow-default-token"]
    # The image has no .env, so the containers see only what is listed here: every setting in
    # .env.example, with config.py's defaults when .env does not set it.
    environment: &agent-env
      # Fixed: the compose services, not the host addresses in .env.
      REPOPILOT_PG_HOST: postgres
      REPOPILOT_PG_PORT: "5432"
      REPOPILOT_REDIS_URL: redis://redis:6379/0
      REPOPILOT_SANDBOX_URL: http://sandbox-svc:8090
      REPOPILOT_PG_DB: ${REPOPILOT_PG_DB:-repopilot}
      REPOPILOT_PG_USER: ${REPOPILOT_PG_USER:-repopilot}
      REPOPILOT_PG_PASSWORD: ${REPOPILOT_PG_PASSWORD:-repopilot_dev_pw}
      REPOPILOT_SANDBOX_TOKEN: ${REPOPILOT_SANDBOX_TOKEN:-dev-sandbox-token-change-me}
      REPOPILOT_API_TOKEN: ${REPOPILOT_API_TOKEN:-dev-api-token-change-me}
      REPOPILOT_UI_ORIGIN: ${REPOPILOT_UI_ORIGIN:-http://127.0.0.1:3000}
      REPOPILOT_JOB_VISIBILITY_S: ${REPOPILOT_JOB_VISIBILITY_S:-1800}
      # An Ollama on the host is http://host.docker.internal:11434/v1 from here.
      REPOPILOT_LLM_BASE_URL: ${REPOPILOT_LLM_BASE_URL:-https://api.openai.com/v1}
      REPOPILOT_LLM_MODEL: ${REPOPILOT_LLM_MODEL:-gpt-4.1-mini}
      REPOPILOT_LLM_API_KEY: ${REPOPILOT_LLM_API_KEY:-}
      REPOPILOT_LLM_TIMEOUT_S: ${REPOPILOT_LLM_TIMEOUT_S:-120}
      REPOPILOT_LLM_PRICE_IN: ${REPOPILOT_LLM_PRICE_IN:-0}
      REPOPILOT_LLM_PRICE_OUT: ${REPOPILOT_LLM_PRICE_OUT:-0}
      REPOPILOT_GITHUB_TOKEN: ${REPOPILOT_GITHUB_TOKEN:-}
      REPOPILOT_GITHUB_API_URL: ${REPOPILOT_GITHUB_API_URL:-https://api.github.com}
      REPOPILOT_EMBED_MODEL: ${REPOPILOT_EMBED_MODEL:-nomic-embed-text}
      REPOPILOT_EMBED_BASE_URL: ${REPOPILOT_EMBED_BASE_URL:-}
      REPOPILOT_CODE_INDEX: ${REPOPILOT_CODE_INDEX:-false}
      REPOPILOT_MCP_ROOTS: ${REPOPILOT_MCP_ROOTS:-}
      # Tracing (off unless an endpoint is set): the otel profile's Jaeger is
      # http://jaeger:4318; Langfuse takes its OTLP endpoint plus the two keys.
      REPOPILOT_OTEL_ENDPOINT: ${REPOPILOT_OTEL_ENDPOINT:-}
      REPOPILOT_OTEL_CAPTURE_CONTENT: ${REPOPILOT_OTEL_CAPTURE_CONTENT:-false}
      REPOPILOT_LANGFUSE_PUBLIC_KEY: ${REPOPILOT_LANGFUSE_PUBLIC_KEY:-}
      REPOPILOT_LANGFUSE_SECRET_KEY: ${REPOPILOT_LANGFUSE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    profiles: ["app"]
    image: repopilot-agent-svc
    command: ["repopilot", "worker", "--name", "compose-worker-1"]
    restart: unless-stopped
    healthcheck: {disable: true}  # the image's HTTP check is for the API
    environment: *agent-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      sandbox-svc: {condition: service_started}

  # Local trace viewer (`docker compose --profile otel up -d jaeger`, UI on :16686). Point
  # REPOPILOT_OTEL_ENDPOINT at http://127.0.0.1:4318, or at Langfuse's OTLP endpoint instead.
  jaeger:
    profiles: ["otel"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
  redisdata:
