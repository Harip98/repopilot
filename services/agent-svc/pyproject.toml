[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot - AI software engineering agent service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
repopilot = "repopilot.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration and not sandbox"]
markers = [
    "integration: needs docker compose Postgres/Redis (run with -m integration)",
    "sandbox: needs compose sandbox-svc and the repopilot-sandbox-base image (run with -m sandbox)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
