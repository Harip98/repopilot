[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot - AI software engineering agent service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "langgraph>=1.2.20,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "mcp>=2,<3",  # the 2.x low-level Server API
    "openai>=3.46.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.27",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0",
    "redis>=5",
    "typer>=0.15",
    "uvicorn>=0.30",
]

[project.scripts]
repopilot = "repopilot.cli:app"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration and not sandbox"]
markers = [
    "integration: needs docker compose Postgres/Redis (run with -m integration)",
    "sandbox: needs compose sandbox-svc and the repopilot-sandbox-base image (run with -m sandbox)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
